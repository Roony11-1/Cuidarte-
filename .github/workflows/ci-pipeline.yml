name: Pipeline de integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detectar archivos modificados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BACKEND/**'
            frontend:
              - 'FRONTEND/**'

  sonar-backend:
    name: Analisis Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Backend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-backend
          sources: ./BACKEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Check Backend Quality Gate
        run: |
          REPORT=$(find . -name "*analysis-report*" -o -name "*sonar*report*" | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró el informe del backend."
            exit 1
          fi
          grep -q "Status.*OK" "$REPORT" && echo "Backend OK" \
            || { echo "Backend fallido. Bloqueando."; exit 1; }

  sonar-frontend:
    name: Analisis Frontend
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend]
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Frontend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-frontend
          sources: ./FRONTEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Check Frontend Quality Gate
        run: |
          REPORT=$(find . -name "*analysis-report*" -o -name "*sonar*report*" | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró el informe del frontend."
            exit 1
          fi
          grep -q "Status.*OK" "$REPORT" && echo "Frontend OK" \
            || { echo "Frontend fallido. Bloqueando."; exit 1; }