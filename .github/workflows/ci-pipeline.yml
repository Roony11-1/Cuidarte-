name: Pipeline de integración continua (Definitivo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      selenium: ${{ steps.filter.outputs.selenium }}
      jmeter: ${{ steps.filter.outputs.jmeter }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detectar archivos modificados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BACKEND/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

            frontend:
              - 'FRONTEND/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

            selenium:
              - 'pruebas-selenium/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

            jmeter:
              - 'BACKEND/**'
              - 'pruebas-jmeter/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'
              - '.github/workflows/jmeter-pr.yml'

  sonar-backend:
    name: Analisis Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Backend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-backend
          sources: ./BACKEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7
          artifact-name: sonar-backend-results

      - name: Download Backend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-backend-results
          path: sonar-backend-report
        continue-on-error: true

      - name: Check Backend Quality Gate
        run: |
          REPORT=$(find . sonar-backend-report -name "analysis_report.md" 2>/dev/null | head -n 1)

          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del backend."
            exit 1
          fi

          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Backend OK" \
            || { echo "Backend fallido. Bloqueando."; exit 1; }

  sonar-frontend:
    name: Analisis Frontend
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.sonar-backend.result == 'success' ||
       needs.sonar-backend.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Frontend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-frontend
          sources: ./FRONTEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7
          artifact-name: sonar-frontend-results

      - name: Download Frontend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-frontend-results
          path: sonar-frontend-report
        continue-on-error: true

      - name: Check Frontend Quality Gate
        run: |
          REPORT=$(find . sonar-frontend-report -name "analysis_report.md" 2>/dev/null | head -n 1)

          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del frontend."
            exit 1
          fi

          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Frontend OK" \
            || { echo "Frontend fallido. Bloqueando."; exit 1; }

  selenium:
    name: Entorno de pruebas Selenium
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend, sonar-frontend]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.selenium == 'true') &&
      (needs.sonar-backend.result == 'success' ||
       needs.sonar-backend.result == 'skipped') &&
      (needs.sonar-frontend.result == 'success' ||
       needs.sonar-frontend.result == 'skipped')

    env:
      COMPOSE_PROJECT_NAME: cuidarteplus-ci
      NODE_ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuidarteplus_test
      PORT_POSTGRES: 15442
      PORT_BACKEND: 4444
      PORT_FRONTEND: 3333
      JWT_SECRET: ci-frase-secreta-2026-bien-gordito-defecto
      BASE_URL: http://localhost:3333
      API_URL: http://localhost:4444
      DB_HOST: localhost
      DB_PORT: 15442
      DB_NAME: cuidarteplus_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar al stack
        run: |
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:4444/openapi.json; do sleep 3; done'
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:3333/; do sleep 3; done'

      - name: Ejecutar tests Selenium
        working-directory: ./pruebas-selenium
        run: mvn -B test

      - name: Publicar reporte
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Selenium Results
          path: pruebas-selenium/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: pruebas-selenium/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Limpieza
        if: always()
        run: docker compose down -v

  owasp-zap:
    name: Ejecutar ZAP, DAST pasivo
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true')

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Levantar el stack para ZAP
        run: docker compose up -d --build

      - name: Esperar al Frontend
        run: |
          timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:3333/; do sleep 3; done'

      - name: Ejecutar ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3333'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: true
          fail_action: false
          artifact_name: 'zap-baseline-report'
          cmd_options: '-a -j -T 60'

      - name: Subir reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-html
          path: report_html.html
          if-no-files-found: ignore

      - name: Limpieza
        if: always()
        run: docker compose down -v

  jmeter-pr:
    name: JMeter ligero (PR)
    needs: [changes, sonar-backend, selenium]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.jmeter == 'true') &&
      (needs.sonar-backend.result == 'success' || needs.sonar-backend.result == 'skipped') &&
      (needs.selenium.result == 'success' || needs.selenium.result == 'skipped')
    uses: ./.github/workflows/jmeter-pr.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      commit_sha: ${{ github.sha }}

  publish-backend:
    name: Publicar imagen Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cuidarte-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar Backend
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    name: Publicar imagen Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cuidarte-frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FRONTEND
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  summary-report:
    name: Resumen Consolidado
    runs-on: ubuntu-latest
    needs:
      - changes
      - sonar-backend
      - sonar-frontend
      - selenium
      - owasp-zap
      - jmeter-pr
    if: always() && github.event_name == 'pull_request'

    permissions:
      contents: read
      actions: read

    steps:
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar artifacts generados en el run
        uses: actions/download-artifact@v4
        with:
          path: consolidated-artifacts
        continue-on-error: true

      - name: Generar tabla unificada en Summary
        env:
          RES_SONAR_BACK: ${{ needs.sonar-backend.result }}
          RES_SONAR_FRONT: ${{ needs.sonar-frontend.result }}
          RES_SELENIUM: ${{ needs.selenium.result }}
          RES_ZAP: ${{ needs.owasp-zap.result }}
          RES_JMETER: ${{ needs.jmeter-pr.result }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          from pathlib import Path


          def parse_sonar_md(path: Path) -> dict:
              text = path.read_text(encoding="utf-8")
              project_m = re.search(r"Project Key:\s*(.+)", text)
              status_m = re.search(r"Status:\s*(.+)", text)
              bugs_m = re.search(r"\|Bugs\|(\d+)\|", text)
              vuln_m = re.search(r"\|Vulnerabilities\|(\d+)\|", text)
              smells_m = re.search(r"\|Code_smells\|(\d+)\|", text)
              return {
                  "project": project_m.group(1).strip() if project_m else "",
                  "status": status_m.group(1).strip() if status_m else "OK",
                  "bugs": bugs_m.group(1) if bugs_m else "0",
                  "vulnerabilities": vuln_m.group(1) if vuln_m else "0",
                  "code_smells": smells_m.group(1) if smells_m else "0",
              }


          def parse_zap_json(path: Path) -> dict:
              data = json.loads(path.read_text(encoding="utf-8"))
              counts = {"High": 0, "Medium": 0, "Low": 0, "Informational": 0}
              for site in data.get("site", []):
                  for alert in site.get("alerts", []):
                      risk = alert.get("riskdesc", "").split(" ")[0]
                      if risk in counts:
                          counts[risk] += 1
              return counts


          def main() -> None:
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if not summary_file:
                  return

              base = Path("consolidated-artifacts")
              sonar_reports = {}
              for md in base.rglob("analysis_report.md"):
                  parsed = parse_sonar_md(md)
                  sonar_reports[parsed["project"]] = parsed

              lines = [
                  "## Resumen Consolidado — Calidad, Seguridad y Rendimiento",
                  "",
                  "| Herramienta / Etapa | Estado | Métricas y Detalles |",
                  "| :--- | :--- | :--- |",
              ]

              # 1. SonarQube Backend
              sb = sonar_reports.get("cuidarteplus-backend")
              if sb:
                  lines.append(
                      f"| SonarQube Backend (SAST) | `{sb['status']}` | "
                      f"Bugs: **{sb['bugs']}** · Vulnerabilidades: **{sb['vulnerabilities']}** · Code Smells: **{sb['code_smells']}** |"
                  )
              else:
                  lines.append(f"| SonarQube Backend (SAST) | `{os.environ.get('RES_SONAR_BACK', 'skipped')}` | Sin cambios en Backend |")

              # 2. SonarQube Frontend
              sf = sonar_reports.get("cuidarteplus-frontend")
              if sf:
                  lines.append(
                      f"| SonarQube Frontend (SAST) | `{sf['status']}` | "
                      f"Bugs: **{sf['bugs']}** · Vulnerabilidades: **{sf['vulnerabilities']}** · Code Smells: **{sf['code_smells']}** |"
                  )
              else:
                  lines.append(f"| SonarQube Frontend (SAST) | `{os.environ.get('RES_SONAR_FRONT', 'skipped')}` | Sin cambios en Frontend |")

              # 3. Selenium E2E
              res_sel = os.environ.get("RES_SELENIUM", "skipped")
              sel_detail = "Suites ejecutadas (detalle completo en la pestaña **Tests**)" if res_sel == "success" else f"Estado job: {res_sel}"
              lines.append(f"| Pruebas Funcionales (Selenium) | `{res_sel.upper()}` | {sel_detail} |")

              # 4. OWASP ZAP DAST
              zap_json = next((p for p in base.rglob("*.json") if "zap" in str(p).lower()), None)
              if zap_json:
                  zc = parse_zap_json(zap_json)
                  lines.append(
                      f"| Seguridad Pasiva (OWASP ZAP) | `{os.environ.get('RES_ZAP', 'success').upper()}` | "
                      f"High: **{zc['High']}** · Medium: **{zc['Medium']}** · Low: **{zc['Low']}** · Info: **{zc['Informational']}** |"
                  )
              else:
                  lines.append(f"| Seguridad Pasiva (OWASP ZAP) | `{os.environ.get('RES_ZAP', 'skipped').upper()}` | Sin ejecución en este PR |")

              # 5. JMeter Performance
              jm_json = next(base.rglob("performance-summary.json"), None)
              if jm_json:
                  jm = json.loads(jm_json.read_text(encoding="utf-8"))
                  jm_status = "PASS" if jm.get("passed") else "FAIL"
                  lines.append(
                      f"| Rendimiento API (JMeter Light) | `{jm_status}` | "
                      f"Req: **{jm.get('total_requests', 0)}** · Fallos: **{jm.get('failed_requests', 0)}** · "
                      f"Avg: **{jm.get('latency_avg_ms', 0)} ms** · p50: **{jm.get('latency_p50_ms', 0)} ms** · p95: **{jm.get('latency_p95_ms', 0)} ms** |"
                  )
              else:
                  lines.append(f"| Rendimiento API (JMeter Light) | `{os.environ.get('RES_JMETER', 'skipped').upper()}` | Sin ejecución en este PR |")

              lines.append("")
              with open(summary_file, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines))


          if __name__ == "__main__":
              main()
          EOF