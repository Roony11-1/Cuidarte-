name: Pipeline de integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detectar cambios
    uses: ./.github/workflows/changes.yml

  sonar:
    name: Analisis SonarQube
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/sonar-analysis.yml
    with:
      backend_changed: ${{ needs.changes.outputs.backend == 'true' }}
      frontend_changed: ${{ needs.changes.outputs.frontend == 'true' }}