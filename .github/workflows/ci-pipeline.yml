name: Pipeline de integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detectar cambios
    uses: ./.github/workflows/changes.yml

  sonar-backend:
    name: Analisis Backend
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/sonar-backend.yml

  sonar-frontend:
    name: Analisis Frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/sonar-frontend.yml