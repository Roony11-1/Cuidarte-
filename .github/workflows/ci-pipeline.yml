name: Pipeline de integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      selenium: ${{ steps.filter.outputs.selenium }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detectar archivos modificados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BACKEND/**'
            frontend:
              - 'FRONTEND/**'
            selenium:
              - 'pruebas-selenium/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

  sonar-backend:
    name: Analisis Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Backend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-backend
          sources: ./BACKEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Download Backend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-analysis-results
          path: sonar-backend-report
        continue-on-error: true

      - name: Check Backend Quality Gate
        run: |
          REPORT=$(find . sonar-backend-report -name "analysis_report.md" 2>/dev/null | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del backend."
            exit 1
          fi
          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Backend OK" \
            || { echo "Backend fallido. Bloqueando."; exit 1; }

  sonar-frontend:
    name: Analisis Frontend
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.sonar-backend.result == 'success' || needs.sonar-backend.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Frontend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-frontend
          sources: ./FRONTEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Download Frontend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-analysis-results
          path: sonar-frontend-report
        continue-on-error: true

      - name: Check Frontend Quality Gate
        run: |
          REPORT=$(find . sonar-frontend-report -name "analysis_report.md" 2>/dev/null | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del frontend."
            exit 1
          fi
          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Frontend OK" \
            || { echo "Frontend fallido. Bloqueando."; exit 1; }

  selenium:
    name: Entorno de pruebas Selenium
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend, sonar-frontend]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.selenium == 'true') &&
      (needs.sonar-backend.result == 'success' || needs.sonar-backend.result == 'skipped') &&
      (needs.sonar-frontend.result == 'success' || needs.sonar-frontend.result == 'skipped')
    
    env:
      COMPOSE_PROJECT_NAME: cuidarteplus-ci
      NODE_ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuidarteplus_test
      PORT_POSTGRES: 15442
      PORT_BACKEND: 4444
      PORT_FRONTEND: 3333
      JWT_SECRET: ci-frase-secreta-2026-bien-gordito-defecto
      # Chrome nativo del runner (el Firefox de Ubuntu es snap y exige Selenium >= 4.30)
      SELENIUM_BROWSER: chrome
      # Variables para el entorno de pruebas
      BASE_URL: http://localhost:3333
      API_URL: http://localhost:4444
      DB_HOST: localhost
      DB_PORT: 15442
      DB_NAME: cuidarteplus_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar al stack
        run: |
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:4444/openapi.json; do sleep 3; done'
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:3333/; do sleep 3; done'

      - name: Ejecutar tests Selenium
        working-directory: ./pruebas-selenium
        run: mvn -B test

      - name: Publicar reporte
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Selenium Results
          path: pruebas-selenium/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: pruebas-selenium/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Limpieza
        if: always()
        run: docker compose down -v
