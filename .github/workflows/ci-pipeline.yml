name: Pipeline de integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      selenium: ${{ steps.filter.outputs.selenium }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detectar archivos modificados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BACKEND/**'
            frontend:
              - 'FRONTEND/**'
            selenium:
              - 'pruebas-selenium/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

  sonar-backend:
    name: Analisis Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Backend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-backend
          sources: ./BACKEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Download Backend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-analysis-results
          path: sonar-backend-report
        continue-on-error: true

      - name: Check Backend Quality Gate
        run: |
          REPORT=$(find . sonar-backend-report -name "analysis_report.md" 2>/dev/null | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del backend."
            exit 1
          fi
          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Backend OK" \
            || { echo "Backend fallido. Bloqueando."; exit 1; }

  sonar-frontend:
    name: Analisis Frontend
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.sonar-backend.result == 'success' || needs.sonar-backend.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar Frontend Analysis
        uses: diekotto/sonar-scanner-analysis@v1
        with:
          project-key: cuidarteplus-frontend
          sources: ./FRONTEND/src
          exclusions: "**/node_modules/**,**/dist/**,**/*.test.js"
          wait-for-server: 120
          retention-days: 7

      - name: Download Frontend Sonar Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-analysis-results
          path: sonar-frontend-report
        continue-on-error: true

      - name: Check Frontend Quality Gate
        run: |
          REPORT=$(find . sonar-frontend-report -name "analysis_report.md" 2>/dev/null | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "No se encontró analysis_report.md del frontend."
            exit 1
          fi
          echo "Informe: $REPORT"
          grep -q "Status.*OK" "$REPORT" && echo "Frontend OK" \
            || { echo "Frontend fallido. Bloqueando."; exit 1; }

  selenium:
    name: Entorno de pruebas Selenium
    runs-on: ubuntu-latest
    needs: [changes, sonar-backend, sonar-frontend]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.selenium == 'true') &&
      (needs.sonar-backend.result == 'success' || needs.sonar-backend.result == 'skipped') &&
      (needs.sonar-frontend.result == 'success' || needs.sonar-frontend.result == 'skipped')

    env:
      COMPOSE_PROJECT_NAME: cuidarteplus-ci
      NODE_ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuidarteplus_test
      PORT_POSTGRES: 15442
      PORT_BACKEND: 4444
      PORT_FRONTEND: 3333
      JWT_SECRET: ci-frase-secreta-2026-bien-gordito-defecto
      BASE_URL: http://localhost:3333
      API_URL: http://localhost:4444
      DB_HOST: localhost
      DB_PORT: 15442
      DB_NAME: cuidarteplus_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar al stack
        run: |
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:4444/openapi.json; do sleep 3; done'
          timeout 240 bash -c 'until curl -s -o /dev/null http://localhost:3333/; do sleep 3; done'

      - name: Ejecutar tests Selenium
        working-directory: ./pruebas-selenium
        run: mvn -B test

      - name: Publicar reporte
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Selenium Results
          path: pruebas-selenium/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: pruebas-selenium/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Limpieza
        if: always()
        run: docker compose down -v

  owasp-zap:
    name: Ejecutar ZAP, DAST pasivo
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Levantar el stack para ZAP
        run: docker compose up -d --build

      - name: Esperar al Frontend
        run: |
          timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:3333/; do sleep 3; done'

      - name: Ejecutar ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3333'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: true
          fail_action: false
          artifact_name: 'zap-baseline-report'
          cmd_options: '-a -j -T 60'

      - name: Subir reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-html
          path: report_html.html
          if-no-files-found: ignore

      - name: Limpieza
        if: always()
        run: docker compose down -v

  publish-backend:
    name: Publicar imagen Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar Backend
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    name: Publicar imagen Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FRONTEND
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}